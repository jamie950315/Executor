name: Go

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  dashboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Test and build Dashboard
        working-directory: dashboard
        run: npm test && npm run check && npm run build
      - name: Test Windows Dashboard deployment entrypoint and ACLs
        if: runner.os == 'Windows'
        shell: powershell
        run: ./dashboard/test/deploy/windows-deployment.tests.ps1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Test privileged Unix credential rotation
        if: runner.os != 'Windows'
        run: sudo "$(command -v go)" test ./internal/secrets -run TestRotatePreservesExistingUnixOwner -count=1

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  dashboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Test and build Dashboard
        working-directory: dashboard
        run: npm test && npm run check && npm run build
      - name: Test Windows Dashboard deployment entrypoint and ACLs
        if: runner.os == 'Windows'
        shell: powershell
        run: ./dashboard/test/deploy/windows-deployment.tests.ps1

  build:
    needs: dashboard
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify tests
        run: go test ./...
      - name: Build release artifact
        run: |
          chmod +x scripts/build-release-artifacts.sh
          EXECUTOR_BUILD_TARGETS="${{ matrix.goos }}/${{ matrix.goarch }}" ./scripts/build-release-artifacts.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: executor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/*

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Consolidate checksums
        run: |
          find dist/artifacts -name 'SHA256SUMS.txt' -print0 | xargs -0 cat > dist/SHA256SUMS.txt
          sha256sum dist/SHA256SUMS.txt
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: executor-checksums
          path: dist/SHA256SUMS.txt
